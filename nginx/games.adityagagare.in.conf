# ==============================================================================
# Nginx Configuration for FixIT Village (WebSocket + Single-Port Node.js)
# Domain: games.adityagagare.in
# Server IP: 187.127.153.41
# ==============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name games.adityagagare.in;

    # Maximum upload size for assets and analytics payloads
    client_max_body_size 20M;

    # Gzip Compression for fast mobile/web asset delivery
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json image/svg+xml;

    location / {
        # Proxy to internal PM2 Node.js process (Port 3001)
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;

        # WebSocket Upgrade Headers (CRITICAL for real-time Socket.IO game sync)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Standard Proxy Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Keep connection open for active game rooms (24h timeout)
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;

        # Disable buffering for instantaneous real-time event streaming
        proxy_buffering off;
        proxy_cache_bypass $http_upgrade;
    }
}
